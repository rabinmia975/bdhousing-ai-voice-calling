<script>
/* =====================================================================
   BDHousing AI Voice Agent — DEMO BUILD
   Demo Mode: everything runs locally in the browser (localStorage).
   Integration points where the real Laravel API would be called are
   marked with apiCall() stubs — see docs/laravel-backend-plan.md.
   Never mark a simulated call as live. No real telephony is touched.
   ===================================================================== */

const LS_LEADS = 'bdh_leads_v1', LS_CALLS = 'bdh_calls_v1';
const store = {
  get(k, fallback){ try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } },
  set(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
};

/* ---------- mock/simulated provider status ---------- */
const AGENT = {
  name: 'BDHousing AI Assistant',
  status: 'Active',
  provider: 'Retell AI',
  languages: ['Bangla', 'English'],
  incoming: false,          // live telephony not configured in demo
  outgoing: false,
  sip: 'Not configured (demo)',
  n8n: 'Simulated',
  laravel: 'Simulated'
};

/* ---------- seed sample data (clearly labeled) ---------- */
function seed(){
  if (!store.get(LS_LEADS, null)) {
    store.set(LS_LEADS, [
      { id:'L-1001', full_name:'Sample: Karim Uddin', phone:'+8801711223344', language:'bn', interest_type:'buy', area:'Uttara, Dhaka', property_type:'apartment', budget:'৳80–120 lakh', size_sqft:'1350', bedrooms:'3', timeline:'3 months', financing:'Yes (voluntary)', extra:'Near school', interest_level:'Warm', callback:'2026-10-28 11:00', followup_consent:true, lead_score:72, status:'interested', assigned:'Sales Rep A', is_demo:true, created:'2026-10-22T10:12:00', summary:'Demo sample lead — interested in 3BR Uttara apartment, budget 80–120 lakh, wants callback next week.' },
      { id:'L-1002', full_name:'Sample: Nusrat Jahan', phone:'+8801899555666', language:'en', interest_type:'rent', area:'Dhanmondi, Dhaka', property_type:'apartment', budget:'৳35–45k/mo', size_sqft:'1100', bedrooms:'2', timeline:'Immediately', financing:'', extra:'', interest_level:'Hot', callback:'', followup_consent:true, lead_score:85, status:'qualified', assigned:'Sales Rep B', is_demo:true, created:'2026-10-24T15:40:00', summary:'Demo sample lead — urgent rental need in Dhanmondi, ready to visit properties this week.' }
    ]);
  }
  if (!store.get(LS_CALLS, null)) {
    store.set(LS_CALLS, [
      { id:'C-2001', lead:'L-1001', name:'Sample: Karim Uddin', phone:'+8801711223344', direction:'outgoing', started:'2026-10-22T10:12:00', duration:214, status:'completed', outcome:'interested', agent:'BDHousing AI Assistant', mode:'demo', is_demo:true, summary:'Discussed 3BR apartments in Uttara; customer wants a callback next week.', transcript:[
        {s:'ai', t:'আসসালামু আলাইকুম। আমি BDHousing-এর AI assistant। আপনি কি বাড়ি বা ফ্ল্যাট কেনা, ভাড়া নেওয়া, অথবা property সম্পর্কে তথ্য পেতে আগ্রহী?'},
        {s:'customer', t:'জি, উত্তরায় একটা ফ্ল্যাট কিনতে চাই।'},
        {s:'ai', t:'ধন্যবাদ! আপনার নাম জানতে পারি কি?'},
        {s:'customer', t:'করিম উদ্দিন।'},
        {s:'ai', t:'আপনার বাজেট কেমন হলে স্বাচ্ছন্দ্যে থাকবে, করিম ভাই?'}
      ]},
      { id:'C-2002', lead:'L-1002', name:'Sample: Nusrat Jahan', phone:'+8801899555666', direction:'outgoing', started:'2026-10-24T15:40:00', duration:186, status:'completed', outcome:'callback_requested', agent:'BDHousing AI Assistant', mode:'demo', is_demo:true, summary:'Rental inquiry in Dhanmondi, urgent. Asked for a human representative to call today.', transcript:[
        {s:'ai', t:'Hello, this is BDHousing’s AI assistant. Are you interested in buying, renting, or property information?'},
        {s:'customer', t:'Yes, renting in Dhanmondi. Can a real person call me back today?'}
      ]}
    ]);
  }
}
seed();

/* ---------- helpers ---------- */
const $content = document.getElementById('content');
const $title = document.getElementById('page-title');
const fmtDate = iso => new Date(iso).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
const fmtDur  = s => Math.floor(s/60)+'m '+(s%60)+'s';
const statusColor = { new:'bg-sky-100 text-sky-700', contacted:'bg-slate-200 text-slate-700', interested:'bg-emerald-100 text-emerald-700', qualified:'bg-green-600 text-white', follow_up_required:'bg-amber-100 text-amber-700', converted:'bg-green-700 text-white', not_interested:'bg-rose-100 text-rose-700', do_not_call:'bg-red-600 text-white' };
const callStatusColor = { queued:'bg-slate-200 text-slate-700', initiated:'bg-sky-100 text-sky-700', ringing:'bg-amber-100 text-amber-700', in_progress:'bg-orange-500 text-white', completed:'bg-green-600 text-white', failed:'bg-red-600 text-white', cancelled:'bg-slate-300 text-slate-600' };
const apiCall = (path, opts) => { /* REAL INTEGRATION POINT — demo build returns locally */ return null; };

/* ---------- navigation ---------- */
document.querySelectorAll('#nav .nav-item').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('#nav .nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const p = btn.dataset.page;
  $title.textContent = { agent:'AI Voice Agent', leads:'Customer Leads', history:'Call History & Analytics', incoming:'Incoming Call Demo' }[p];
  if (p === 'agent') renderAgent(); else if (p==='leads') renderLeads(); else if (p==='history') renderHistory(); else renderIncoming();
}));
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }

/* =====================================================================
   PAGE 1 — AI VOICE AGENT (dashboard + outgoing call demo)
   ===================================================================== */
let activeSim = null;
function renderAgent(){
  const calls = store.get(LS_CALLS, []);
  const completed = calls.filter(c=>c.status==='completed').length;
  const failed = calls.filter(c=>c.status==='failed').length;
  $content.innerHTML = `
  <div class="bg-white rounded-xl border border-slate-200 p-6">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 rounded-xl bg-[#0b1f3a] flex items-center justify-center text-2xl">🤖</div>
        <div>
          <h2 class="text-lg font-semibold text-slate-900">${AGENT.name}</h2>
          <p class="text-sm text-slate-500">Provider: ${AGENT.provider} · Languages: ${AGENT.languages.join(', ')}</p>
          <div class="flex gap-2 mt-2 text-xs">
            <span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 bg-emerald-100 text-emerald-700"><span class="status-dot bg-emerald-500"></span>${AGENT.status}</span>
            <span class="rounded-full px-2.5 py-1 bg-amber-100 text-amber-700">Bangla voice: pending verification</span>
          </div>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-x-6 gap-y-2 text-sm">
        ${statRow('Incoming calls', AGENT.incoming)}
        ${statRow('Outgoing calls', AGENT.outgoing)}
        ${connRow('Phone / SIP', AGENT.sip)}
        ${connRow('n8n', AGENT.n8n)}
        ${connRow('Laravel API', AGENT.laravel)}
      </div>
    </div>
    <p class="mt-4 text-xs text-slate-400">Live telephony is not configured, so calling runs in <b>simulation</b>. When Retell API keys, phone number, and n8n are configured, these turn green and "Test AI Call" routes through Laravel → n8n → Retell.</p>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-6 gap-4">
    ${statCard('Total calls', calls.length)}
    ${statCard('Completed', completed)}
    ${statCard('Failed', failed)}
    ${statCard('Interested leads', store.get(LS_LEADS,[]).filter(l=>['interested','qualified'].includes(l.status)).length)}
    ${statCard('Qualified', store.get(LS_LEADS,[]).filter(l=>l.status==='qualified').length)}
    ${statCard('Follow-ups', store.get(LS_LEADS,[]).filter(l=>l.callback).length)}
  </div>

  <div class="grid lg:grid-cols-2 gap-6">
    <!-- Test AI Call form -->
    <div class="bg-white rounded-xl border border-slate-200 p-6">
      <h3 class="font-semibold text-slate-900 mb-1">Outgoing Call Demo</h3>
      <p class="text-xs text-amber-700 mb-4">Simulation — No real phone call will be placed.</p>
      <form id="call-form" class="space-y-3 text-sm">
        ${inputField('Customer name', 'cname', 'text', 'e.g. Rahim Ahmed')}
        ${inputField('Customer phone (with country code)', 'cphone', 'tel', '+8801XXXXXXXXX')}
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-slate-600 mb-1">Preferred language</label>
            <select id="clang" class="w-full border border-slate-300 rounded-lg px-3 py-2"><option value="bn">Bangla</option><option value="en">English</option></select></div>
          <div><label class="block text-slate-600 mb-1">Property interest</label>
            <select id="cinterest" class="w-full border border-slate-300 rounded-lg px-3 py-2"><option value="apartment">Apartment</option><option value="house">House</option><option value="land">Land</option><option value="commercial">Commercial</option></select></div>
        </div>
        <div><label class="block text-slate-600 mb-1">Call purpose</label>
          <select id="cpurpose" class="w-full border border-slate-300 rounded-lg px-3 py-2"><option>Lead follow-up</option><option>New property introduction</option><option>General inquiry</option></select></div>
        <label class="flex items-start gap-2 text-slate-600"><input type="checkbox" id="cconsent" class="mt-0.5"> <span>I confirm this customer has given consent to be called (required for live calls).</span></label>
        <p id="form-error" class="hidden text-rose-600 text-xs"></p>
        <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold rounded-lg py-2.5">📞 Test AI Call</button>
      </form>
    </div>

    <!-- Call activity panel -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 flex flex-col">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold text-slate-900">Call Activity</h3>
        <span id="sim-status" class="text-xs rounded-full px-3 py-1 bg-slate-200 text-slate-600">Idle</span>
      </div>
      <div id="sim-panel" class="flex-1 overflow-y-auto space-y-3 max-h-[420px] text-sm">
        <p class="text-slate-400 text-center py-10">Start a test call to see the simulated AI conversation.</p>

  document.getElementById('call-form').addEventListener('submit', startOutgoingSim);
}
const statRow = (label, on) => `<div class="flex items-center gap-2"><span class="status-dot ${on?'bg-emerald-500':'bg-slate-300'}"></span><span class="text-slate-500">${label}:</span><span class="font-medium">${on?'Enabled':'Disabled'}</span></div>`;
const connRow = (label, val) => `<div class="flex items-center gap-2 text-slate-500">${label}: <span class="font-medium text-slate-700">${val}</span></div>`;
const statCard = (label, v) => `<div class="bg-white rounded-xl border border-slate-200 p-4"><p class="text-xs text-slate-500">${label}</p><p class="text-2xl font-semibold text-slate-900 mt-1">${v}</p></div>`;
const inputField = (label, id, type, ph) => `<div><label class="block text-slate-600 mb-1">${label}</label><input id="${id}" type="${type}" placeholder="${ph}" class="w-full border border-slate-300 rounded-lg px-3 py-2"></div>`;

/* ---------- outgoing call simulation engine ---------- */
function startOutgoingSim(e){
  e.preventDefault();
  const name = document.getElementById('cname').value.trim();
  const phone = document.getElementById('cphone').value.trim();
  const lang = document.getElementById('clang').value;
  const interest = document.getElementById('cinterest').value;
  const purpose = document.getElementById('cpurpose').value;
  const consent = document.getElementById('cconsent').checked;
  const err = document.getElementById('form-error');
  if (!name) return showError(err, 'Customer name is required.');
  if (!/^\+?[1-9]\d{7,14}$/.test(phone.replace(/[\s-]/g,''))) return showError(err, 'Enter a valid phone number with country code, e.g. +8801711223344.');
  if (!consent) return showError(err, 'Customer consent must be confirmed before any call (even simulated).');
  err.classList.add('hidden');

  // LIVE MODE INTEGRATION POINT (not reachable in demo build):
  // POST /api/ai-calls/outbound → Laravel → n8n Workflow A → Retell create-phone-call.
  // Demo build: run simulation only. Never claim a real call was placed.
  runSimulation({ name, phone, lang, interest, purpose, direction:'outgoing' });
}
function showError(err, msg){ err.textContent = msg; err.classList.remove('hidden'); }

function simScript(name, lang, interest){
  const bn = lang !== 'en';
  const s = bn ? [
    ['ai','আসসালামু আলাইকুম। আমি BDHousing-এর AI assistant। আপনি কি বাড়ি বা ফ্ল্যাট কেনা, ভাড়া নেওয়া, অথবা property সম্পর্কে তথ্য পেতে আগ্রহী?'],
    ['customer','জি, আমি আগ্রহী।'],
    ['ai','ধন্যবাদ! আপনার নাম জানতে পারি কি?'],
    ['customer', name],
    ['ai','আপনি কোন এলাকায় বাসা খুঁজছেন?'],
    ['customer','গুলশান, ঢাকা।'],
    ['ai','আপনার বাজেট কেমন হলে ভালো হয়?'],
    ['customer','৮০ থেকে ১২০ লাখ টাকা।'],
    ['ai','কয়টা বেডরুম প্রয়োজন হবে?'],
    ['customer','তিনটা।'],
    ['ai','কখন থেকে বাসা নিতে চান?'],
    ['customer','দুই-তিন মাসের মধ্যে।'],
    ['ai','আর কিছু বিশেষ চাহিদা আছে কি? (চাইলে এই প্রশ্নটি এড়িয়ে যেতে পারেন)'],
    ['customer','লিফট আর গাড়ি পার্কিং থাকলে ভালো হয়।'],
    ['ai','আপনাকে পরে আবার ফোন করতে পারি কি?'],
    ['customer','জি, অবশ্যই।'],
    ['ai','ধন্যবাদ, আপনার সময়ের জন্য। BDHousing আপনার সেবায় আছে। আল্লাহ হাফেজ।']
  ] : [
    ['ai','Hello! This is BDHousing’s AI assistant. Are you interested in buying, renting, or property information?'],
    ['customer','Yes, interested.'],
    ['ai','Thank you! May I have your name?'],
    ['customer', name],
    ['ai','Which area are you looking at?'],
    ['customer','Gulshan, Dhaka.'],
    ['ai','What is your budget range?'],
    ['customer','80 to 120 lakh BDT.'],
    ['ai','How many bedrooms do you need?'],
    ['customer','Three.'],
    ['ai','When do you plan to move in?'],
    ['customer','Within two to three months.'],
    ['ai','Any special requirements? (You can skip this question)'],
    ['customer','Lift and parking would be nice.'],
    ['ai','May we call you again for follow-up?'],
    ['customer','Yes, of course.'],
    ['ai','Thank you for your time. BDHousing is at your service. Goodbye!']
  ];
  return s;
}

function runSimulation(ctx){
  if (activeSim) return;
  const panel = document.getElementById('sim-panel');
  const badge = document.getElementById('sim-status');
  const callId = 'C-' + Math.floor(1000 + Math.random()*9000);
  const stages = [
    ['queued', 'Queued', 700],
    ['initiated', 'Initiated (simulated)', 900],
    ['ringing', 'Ringing — simulated connection', 1400],
    ['in_progress', 'In Progress — AI conversation', 1200]
  ];
  activeSim = { id: callId, ctx, cancelled: false, turns: [], startedAt: new Date().toISOString() };
  panel.innerHTML = `<p class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">⚠️ Simulation — No real phone call is being placed.</p>`;
  badge.className = 'text-xs rounded-full px-3 py-1 bg-slate-200 text-slate-600';
  let i = 0;
  activeSim.target = { panel, badge };
  const nextStage = () => {
    if (!activeSim || activeSim.cancelled) return;
    if (i < stages.length){
      const [key, label, ms] = stages[i++];
      badge.textContent = label;
      badge.className = `text-xs rounded-full px-3 py-1 ${callStatusColor[key]}`;
      if (key === 'ringing' || key === 'in_progress') badge.classList.add('ringing'); else badge.classList.remove('ringing');
      badge.className = `text-xs rounded-full px-3 py-1 ${callStatusColor[key]}` + (key==='ringing'||key==='in_progress' ? ' ringing' : '');
      setTimeout(nextStage, ms);
    } else { runConversation(); }
  };
  nextStage();

  function runConversation(){
    const script = simScript(ctx.name, ctx.lang, ctx.interest);
    let t = 0;
    const speak = () => {
      if (!activeSim || activeSim.cancelled) return;
      if (t < script.length){
        const [who, text] = script[t++];
        activeSim.turns.push({ s: who === 'ai' ? 'ai' : 'customer', t: text });
        const p = (activeSim.target && activeSim.target.panel) || panel;
        p.insertAdjacentHTML('beforeend', bubble(who, text));
        p.scrollTop = p.scrollHeight;
        setTimeout(speak, who === 'ai' ? 1100 : 900);
      } else { finishSim('completed'); }
    };
    speak();
  }
}

function bubble(who, text){
  const ai = who === 'ai';
  return `<div class="flex ${ai?'':'justify-end'}"><div class="${ai?'bg-[#0b1f3a] text-white':'bg-orange-100 text-slate-800'} rounded-xl px-3.5 py-2 max-w-[85%]"><p class="text-[10px] uppercase tracking-wide ${ai?'text-slate-400':'text-orange-500'} mb-0.5">${ai?'AI Assistant':'Customer (simulated)'}</p>${text}</div></div>`;
}

function finishSim(status){
  if (!activeSim) return;
  const { ctx, turns } = activeSim;
  const ui = activeSim.target || { panel: document.getElementById('sim-panel'), badge: document.getElementById('sim-status') };
  const duration = 150 + Math.floor(Math.random()*120);
  const now = new Date();
  // simulated extraction → demo lead (is_demo=true, mode=demo)
  const lead = {
    id: 'L-' + Math.floor(1000 + Math.random()*9000),
    full_name: ctx.name, phone: ctx.phone, language: ctx.lang,
    interest_type: ctx.direction === 'incoming' ? 'general_inquiry' : (ctx.purpose === 'Lead follow-up' ? 'buy' : 'general_inquiry'),
    area: ctx.direction === 'incoming' ? 'Mirpur, Dhaka' : 'Gulshan, Dhaka',
    property_type: ctx.interest || 'apartment',
    budget: '৳80–120 lakh', size_sqft: '1450', bedrooms: '3',
    timeline: '2–3 months', financing: '', extra: 'Lift & parking preferred',
    interest_level: 'Hot', callback: new Date(now.getTime()+3*864e5).toISOString().slice(0,16),
    followup_consent: true, lead_score: 78, status: 'interested',
    assigned: 'Unassigned', is_demo: true, created: now.toISOString(),
    summary: `AI call summary (demo): ${ctx.name} is interested in ${ctx.interest||'property'} in ${ctx.direction==='incoming'?'Mirpur':'Gulshan'}, budget ৳80–120 lakh, wants follow-up.`
  };
  const call = {
    id: activeSim.id, lead: lead.id, name: lead.full_name, phone: lead.phone,
    direction: ctx.direction, started: now.toISOString(), duration,
    status, outcome: status === 'completed' ? 'interested' : status,
    agent: AGENT.name, mode: 'demo', is_demo: true,
    summary: lead.summary, transcript: turns
  };
  store.set(LS_LEADS, [lead, ...store.get(LS_LEADS, [])]);
  store.set(LS_CALLS, [call, ...store.get(LS_CALLS, [])]);
  ui.badge.textContent = status === 'completed' ? 'Completed (simulated)' : status;
  ui.badge.className = `text-xs rounded-full px-3 py-1 ${callStatusColor[status]}`;
  ui.panel.insertAdjacentHTML('beforeend',
    `<div class="bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-lg px-3 py-2 text-xs">
      Call finished (simulated). Demo lead <b>${lead.id}</b> and call <b>${call.id}</b> saved to the local demo database.</div>`);
  activeSim = null;
}

const kv = (k,v) => `<div><p class="text-xs text-slate-500">${k}</p><p class="font-medium capitalize">${v ?? '—'}</p></div>`;

function exportCsv(){
  const leads = store.get(LS_LEADS, []);
  const head = ['Customer','Phone','Interest Type','Preferred Area','Budget','Property Type','Lead Score','Last Call','Follow-up Date','Status'];
  const csv = [head.join(',')].concat(leads.map(l =>
    [l.full_name,l.phone,l.interest_type,l.area,l.budget,l.property_type,l.lead_score,l.created,l.callback,l.status]
    .map(v=>`"${(v??'').toString().replace(/"/g,'""')}"`).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'bdhousing-leads.csv'; a.click();
}

/* =====================================================================
   PAGE 4 — INCOMING CALL DEMO
   ===================================================================== */
function renderIncoming(){
  $content.innerHTML = `
  <div class="grid lg:grid-cols-2 gap-6">
    <div class="bg-white rounded-xl border border-slate-200 p-6">
      <h3 class="font-semibold text-slate-900 mb-1">Incoming Call Workflow</h3>
      <p class="text-xs text-amber-700 mb-4">Live incoming calling is not configured — this is an interactive simulation.</p>
      <ol class="text-sm space-y-2 list-decimal list-inside text-slate-600 mb-5">
        <li>Caller dials the BDHousing number → provider routes to Retell AI</li>
        <li>Retell greets the caller and identifies intent</li>
        <li>AI answers only from verified property data / approved FAQs</li>
        <li>AI collects lead information, one question at a time</li>
        <li>Offers a human callback if requested</li>
        <li>Result saved through the Laravel API (Workflow B)</li>
      </ol>
      <button id="btn-incoming" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold rounded-lg py-2.5">☎️ Simulate Incoming Call</button>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 p-6 flex flex-col">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold text-slate-900">Simulated Conversation</h3>
        <span id="inc-status" class="text-xs rounded-full px-3 py-1 bg-slate-200 text-slate-600">Idle</span>
      </div>
      <div id="inc-panel" class="flex-1 overflow-y-auto space-y-3 max-h-[420px] text-sm">
        <p class="text-slate-400 text-center py-10">Click "Simulate Incoming Call" to play the workflow.</p>
      </div>
    </div>
  </div>`;
  document.getElementById('btn-incoming').addEventListener('click', () => {
    if (activeSim) return;
    // Reuse the simulation engine pointed at the incoming panel
    const panel = document.getElementById('sim-panel');
    const badge = document.getElementById('sim-status');
    // temporarily bind engine outputs to the incoming panel
    const simPanel = document.getElementById('inc-panel');
    const simStatus = document.getElementById('inc-status');
    const engine = { panel: simPanel, badge: simStatus };
    activeSim = { id:'C-'+Math.floor(1000+Math.random()*9000), ctx:{ name:'Incoming caller', phone:'+8801XXXXXXXXX', lang:'bn', interest:'apartment', purpose:'Incoming', direction:'incoming' }, cancelled:false, turns:[] , startedAt:new Date().toISOString(), target:engine };
    simPanel.innerHTML = `<p class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">⚠️ Simulation — No real phone call is being placed.</p>`;
    simStatus.textContent = 'In Progress — AI conversation';
    simStatus.className = 'text-xs rounded-full px-3 py-1 ' + callStatusColor.in_progress;
    const script = [
      ['ai','আসসালামু আলাইকুম। BDHousing-এ আপনাকে স্বাগতম। আমি BDHousing-এর AI assistant। কীভাবে সাহায্য করতে পারি?'],
      ['customer','মিরপুরে একটা ফ্ল্যাট ভাড়া নিতে চাই। কি কি আছে?'],
      ['ai','আপনার জন্য মিরপুরে কয়েকটি ভেরিফায়েড লিস্টিং আছে। বাজেট কেমন হলে ভালো হয়?'],
      ['customer','মাসে ২০–৩০ হাজার টাকা।'],
      ['ai','আপনার নাম ও একটি ফোন নম্বর দিতে পারবেন কি? প্রতিনিধি আপনাকে ডিটেইলস দিতে পারবেন।'],
      ['customer','হুম, মানুষের সাথে কথা বলতে চাই।'],
      ['ai','অবশ্যই। আমাদের একজন প্রতিনিধি আপনাকে আজই কলব্যাক দিবেন। ধন্যবাদ, BDHousing-এ কল করার জন্য।']
    ];
    let t = 0;
    const speak = () => {
      if (!activeSim || activeSim.cancelled) return;
      if (t < script.length){
        const [who, text] = script[t++];
        activeSim.turns.push({ s: who === 'ai' ? 'ai' : 'customer', t: text });
        simPanel.insertAdjacentHTML('beforeend', bubble(who, text));
        simPanel.scrollTop = simPanel.scrollHeight;
        setTimeout(speak, who==='ai' ? 1200 : 1000);
      } else {
        // finish: save with callback_requested outcome
        finishSim('completed');
      }
    };
    speak();
  });
}
renderAgent();
